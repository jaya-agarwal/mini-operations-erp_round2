version: "3.9"

# This compose file is for local/offline evaluation only (spin up Postgres +
# backend with one command, no Neon account required). For the actual
# submission, DATABASE_URL in backend/.env should point at Neon instead —
# see README "Database Setup". Swap DATABASE_URL in the backend service
# below to use this Postgres, or point it at Neon and skip the `db` service
# entirely.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: minierp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/minierp"
      JWT_SECRET: "change-this-to-a-long-random-string"
      JWT_EXPIRES_IN: "8h"
      PORT: 4000
      NODE_ENV: "production"
      ENFORCE_LOCATION_RESTRICTION: "false"
    ports:
      - "4000:4000"
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && node dist/index.js"

volumes:
  pgdata:
